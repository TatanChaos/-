<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#f3eee2"/>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="gray"/>
    <feComponentTransfer in="gray">
      <feFuncA type="linear" slope="0.1"/>
    </feComponentTransfer>
  </filter>
  <rect width="900" height="900" filter="url(#grain)"/>
  <g stroke="#8b7f66" stroke-width="1" opacity="0.08" fill="none">
    <path d="M20 180 Q140 120 280 170 T540 160 T860 180"/>
    <path d="M30 700 Q180 640 340 690 T760 700 T880 680"/>
  </g>
</svg>
