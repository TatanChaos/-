<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稽古状态 · 颐真书房</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/cinematic.css">
<style>
  :root {
    --bg: #e9ece4;
    --surface: #faf7ef;
    --ink: #252b27;
    --muted: #6f6d61;
    --line: #b7ab92;
    --red: #9f3a31;
    --red-soft: #f3e1dc;
    --amber: #8a5c2b;
    --amber-soft: #f2e6d2;
    --teal: #1f4a44;
    --teal-soft: #dce9e2;
    --gold: #b08b4a;
    --ink-deep: #1e2d2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: url("assets/paper.svg");
    background-size: 900px 900px;
    color: var(--ink);
    font-family: "PingFang SC", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    letter-spacing: 0;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: var(--ink-deep);
    border-bottom: 3px solid var(--gold);
    color: var(--paper, #f7f2e6);
  }
  header img { width: 38px; height: 38px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 17px; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: #c7d3cd; }
  .back { color: #c7d3cd; font-size: 12px; text-decoration: none; border: 1px solid rgba(247,242,230,.28); padding: 6px 10px; }
  main {
    width: min(100%, 820px);
    margin: 0 auto;
    padding: 28px 18px 44px;
  }
  h2 { margin: 0 0 8px; font-size: 28px; font-family: "Songti SC", "STSong", "Noto Serif SC", serif; letter-spacing: .1em; }
  .intro { margin: 0 0 22px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .stat {
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
  }
  .stat b { display: block; font-size: 32px; color: var(--ink-deep); }
  .stat span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .stat.verified { border-left-color: var(--teal); }
  .stat.synthetic { border-left-color: var(--amber); }
  .stat.pending { border-left-color: var(--red); }
  .note { margin-top: 16px; padding: 14px; background: var(--amber-soft); border-left: 4px solid var(--amber); font-size: 12px; line-height: 1.8; color: var(--muted); }
  footer { padding: 14px 18px 24px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body class="theme-audit">
  <header>
    <div class="brand">
      <img src="assets/logo.svg" alt="颐真">
      <div><h1 data-en="Source Audit">稽古状态</h1><p>出处审计 · 实时可见</p></div>
    </div>
    <a class="back" href="index.html">返回沙盘</a>
  </header>
  <main>
    <h2>出处审计</h2>
    <p class="intro">这里是作品原文/出处状态的实时页面。只显示审计结果，不把内部文档当公开内容堆给你。</p>
    <div class="grid" id="stats">
      <div class="stat"><b>—</b><span>出处条目</span></div>
      <div class="stat verified"><b>—</b><span>已锚定</span></div>
      <div class="stat synthetic"><b>—</b><span>初笺/通行</span></div>
      <div class="stat pending"><b>—</b><span>待复核/待补</span></div>
    </div>
    <div class="note" id="note">请在服务端模式打开，例如 http://127.0.0.1:8780/稽古.html。</div>
  </main>
  <footer>© 2026 颐真书房 · 文化研究工具</footer>
  <script>
    async function load() {
      const stats = document.getElementById("stats");
      const note = document.getElementById("note");
      try {
        const res = await fetch("/api/audit");
        if (!res.ok) throw new Error("api error");
        const d = await res.json();
        const values = [d.total, d.verified, d.synthetic, d.pending];
        stats.querySelectorAll(".stat b").forEach((el, i) => { el.textContent = values[i] ?? "—"; });
        note.textContent = "文档待补：" + (d.docsPending || 0) + " 处。状态说明：已锚定=原文已对校；初笺/通行=我们自己或通行体系的解释；待复核=仍缺原文。";
      } catch {
        note.textContent = "读取失败。请用服务端模式打开，例如 http://127.0.0.1:8780/稽古.html。";
      }
    }
    load();
  </script>
  <script src="assets/cinematic.js"></script>
</body>
</html>
