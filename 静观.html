<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>静观 · 佛道参照 · 颐真书房</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/cinematic.css">
<style>
  :root {
    --bg: #e9ece4;
    --surface: #faf7ef;
    --ink: #252b27;
    --muted: #6f6d61;
    --line: #b7ab92;
    --red: #9f3a31;
    --amber: #8a5c2b;
    --teal: #1f4a44;
    --gold: #b08b4a;
    --ink-deep: #1e2d2a;
    --paper-soft: #fffdf8;
    --wash: #f4efe3;
  }
  * { box-sizing: border-box; }
  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: url("assets/paper.svg");
    background-size: 900px 900px;
    color: var(--ink);
    font-family: "PingFang SC", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    letter-spacing: 0;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 18px;
    background: rgba(23, 34, 30, .72);
    backdrop-filter: blur(12px);
    border-bottom: 3px solid var(--gold);
    color: var(--paper-soft);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: #c7d3cd;
  }
  header a {
    color: #c7d3cd;
    font-size: 12px;
    text-decoration: none;
    border: 1px solid rgba(247, 242, 230, .28);
    padding: 6px 10px;
  }
  main {
    position: relative;
    z-index: 1;
    width: min(100%, 820px);
    margin: 0 auto;
    padding: 42px 18px 64px;
  }
  .still-head {
    text-align: center;
    color: var(--paper-soft);
  }
  .still-head .seal {
    display: inline-block;
    margin-bottom: 14px;
    padding: 6px 11px;
    border: 1px solid var(--red);
    color: #f3c7c1;
    font-size: 11px;
    letter-spacing: .2em;
    transform: rotate(-2deg);
  }
  .still-head h2 {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: clamp(30px, 7vw, 54px);
    line-height: 1.2;
    letter-spacing: .1em;
  }
  .still-head p {
    max-width: 560px;
    margin: 14px auto 0;
    font-size: 14px;
    line-height: 1.9;
    color: rgba(247, 242, 230, .78);
  }
  .quote-wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin-top: 34px;
  }
  .quote-card {
    margin: 0;
    padding: 18px 16px 14px;
    background: rgba(250, 247, 239, .94);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
  }
  .quote-card blockquote {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 16px;
    line-height: 1.9;
  }
  .quote-card figcaption {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .still-tool {
    margin-top: 24px;
    padding: 24px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 4px solid var(--teal);
    text-align: center;
  }
  .still-tool h3 {
    margin: 0 0 8px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 20px;
    color: var(--ink-deep);
  }
  .still-tool p {
    margin: 0 auto 18px;
    max-width: 520px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
  }
  .timer-display {
    margin: 0 0 16px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 52px;
    line-height: 1;
    color: var(--ink-deep);
  }
  .timer-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .timer-controls button {
    min-height: 44px;
    padding: 0 20px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--teal);
    background: var(--teal);
    color: #fff;
    cursor: pointer;
  }
  .timer-controls button.secondary {
    background: transparent;
    color: var(--teal);
  }
  .still-note {
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
  }
  .boundary {
    margin-top: 24px;
    padding: 16px;
    background: var(--wash);
    border-left: 4px solid var(--amber);
    font-size: 12px;
    line-height: 1.9;
    color: var(--muted);
  }
  .boundary strong {
    color: var(--ink-deep);
  }
  @media (max-width: 520px) {
    header {
      align-items: flex-start;
      flex-direction: column;
    }
    .timer-display {
      font-size: 42px;
    }
  }
</style>
</head>
<body class="theme-life">
  <header>
    <div>
      <h1 data-en="Stillness">静观 · 佛道参照</h1>
      <p>先停一停，再回去拆结构</p>
    </div>
    <a href="入口.html">版本入口</a>
  </header>
  <main>
    <section class="still-head">
      <span class="seal">静观</span>
      <h2>不急着回答<br>先让念头落地</h2>
      <p>佛道经典不是拿来算命，是提醒我们：心静下来，结构才看得清。这里只放三句可查原句，和一只本地三分钟计时器。</p>
    </section>
    <section class="quote-wall" aria-label="佛道原句">
      <figure class="quote-card">
        <blockquote>人能常清静，天地悉皆归。</blockquote>
        <figcaption>《太上老君说常清静经》</figcaption>
      </figure>
      <figure class="quote-card">
        <blockquote>至虚极也，守静笃也，万物并作，吾以观其复。</blockquote>
        <figcaption>《文子 · 道原》引老子</figcaption>
      </figure>
      <figure class="quote-card">
        <blockquote>应无所住而生其心。</blockquote>
        <figcaption>《金刚经》</figcaption>
      </figure>
    </section>
    <section class="still-tool" aria-label="三分钟静观计时">
      <h3>三分钟静观</h3>
      <p>不做判断，不求结果。只观察呼吸，或者观察一个念头来去。</p>
      <div class="timer-display" id="timerDisplay" aria-live="polite">03:00</div>
      <div class="timer-controls">
        <button type="button" id="timerStart">开始</button>
        <button type="button" id="timerReset" class="secondary">重置</button>
      </div>
      <p class="still-note">计时只在本机进行，不上传，不采集。</p>
    </section>
    <section class="boundary">
      <strong>边界</strong>：佛道经典用于理解“心如何运作”，干支三式用于拆“现实事件的结构”；两者不互相包装。真实样本回填前，任何断语都不成立。
    </section>
  </main>
  <script>
    (function () {
      var display = document.getElementById("timerDisplay");
      var start = document.getElementById("timerStart");
      var reset = document.getElementById("timerReset");
      var total = 180;
      var remaining = total;
      var timer = null;
      var running = false;
      function render() {
        var m = String(Math.floor(remaining / 60)).padStart(2, "0");
        var s = String(remaining % 60).padStart(2, "0");
        display.textContent = m + ":" + s;
      }
      function stop() {
        if (timer) clearInterval(timer);
        timer = null;
        running = false;
        start.textContent = "继续";
      }
      start.addEventListener("click", function () {
        if (running) {
          stop();
          return;
        }
        if (remaining <= 0) remaining = total;
        running = true;
        start.textContent = "暂停";
        timer = setInterval(function () {
          remaining -= 1;
          render();
          if (remaining <= 0) {
            stop();
            start.textContent = "再来一次";
          }
        }, 1000);
      });
      reset.addEventListener("click", function () {
        stop();
        remaining = total;
        start.textContent = "开始";
        render();
      });
      render();
    })();
  </script>
  <script src="assets/cinematic.js"></script>
</body>
</html>
