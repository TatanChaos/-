<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄历 · 颐真书房</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
  :root {
    --bg: #e9ece4;
    --paper: #faf7ef;
    --ink: #252b27;
    --muted: #6f6d61;
    --line: #b7ab92;
    --red: #9f3a31;
    --amber: #8a5c2b;
    --teal: #1f4a44;
    --gold: #b08b4a;
    --ink-deep: #1e2d2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: url("assets/paper.svg");
    background-size: 900px 900px;
    color: var(--ink);
    font-family: "PingFang SC", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    letter-spacing: 0;
  }
  header { padding: 12px 18px; background: var(--ink-deep); border-bottom: 3px solid var(--gold); color: var(--paper); display: flex; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; font-size: 12px; color: #c7d3cd; }
  header a { color: #c7d3cd; font-size: 12px; text-decoration: none; border: 1px solid rgba(247,242,230,.28); padding: 6px 10px; }
  main { width: min(100%, 820px); margin: 0 auto; padding: 24px 18px 40px; }
  h2 { margin: 0 0 8px; font-size: 26px; }
  .intro { margin: 0 0 18px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .tool { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tool input { flex: 1; min-width: 180px; padding: 10px; font: inherit; border: 1px solid var(--line); background: #fffdf8; color: var(--ink); }
  .tool button { padding: 10px 16px; font: inherit; border: 1px solid var(--red); background: var(--red); color: #fff; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .card { padding: 14px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--gold); }
  .card b { display: block; margin-bottom: 6px; color: var(--ink-deep); }
  .card span { font-size: 12px; line-height: 1.7; color: var(--muted); }
  .note { margin-top: 16px; padding: 12px; background: #f2e6d2; border-left: 4px solid var(--amber); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div><h1>黄历 · 颐真书房</h1><p>宜忌、冲煞、彭祖百忌，候选研究用</p></div>
    <a href="入口.html">版本入口</a>
  </header>
  <main>
    <h2>今日黄历</h2>
    <p class="intro">用 lunar-typescript 本地历法计算，不联网、不上传。只作文化结构研究，不代替择日建议。</p>
    <div class="tool">
      <input type="date" id="date">
      <button id="go">查黄历</button>
    </div>
    <div class="cards" id="out"><div class="card"><b>加载中</b><span>正在读取…</span></div></div>
    <div class="note">黄历宜忌是通行历法口径，流派差异仍待复核；真实样本回填前不作为决策依据。</div>
  </main>
  <script>
    const dateInput = document.getElementById("date");
    const out = document.getElementById("out");
    dateInput.value = new Date().toISOString().slice(0, 10);
    async function load() {
      out.innerHTML = '<div class="card"><b>加载中</b><span>正在读取…</span></div>';
      try {
        const res = await fetch("/api/huangli?date=" + encodeURIComponent(dateInput.value));
        const d = await res.json();
        out.innerHTML = `
          <div class="card"><b>农历</b><span>${d.lunar || ""}</span></div>
          <div class="card"><b>日干支</b><span>${d.dayGanZhi || ""}</span></div>
          <div class="card"><b>宜</b><span>${(d.yi || []).join("、") || "暂无"}</span></div>
          <div class="card"><b>忌</b><span>${(d.ji || []).join("、") || "暂无"}</span></div>
          <div class="card"><b>吉神</b><span>${(d.jiShen || []).join("、") || "暂无"}</span></div>
          <div class="card"><b>凶煞</b><span>${(d.xiongSha || []).join("、") || "暂无"}</span></div>
          <div class="card"><b>彭祖百忌</b><span>${d.pengZuGan || ""}；${d.pengZuZhi || ""}</span></div>
          <div class="card"><b>冲煞</b><span>${d.chong || ""} · 煞${d.sha || ""}</span></div>
          <div class="card"><b>方位</b><span>${Object.entries(d.positions || {}).map(([k,v]) => k + "：" + v).join("；")}</span></div>
        `;
      } catch {
        out.innerHTML = '<div class="card"><b>读取失败</b><span>请用服务端模式打开。</span></div>';
      }
    }
    document.getElementById("go").addEventListener("click", load);
    dateInput.addEventListener("change", load);
    load();
  </script>
</body>
</html>
