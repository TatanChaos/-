<style>
  :root {
    --bg: #e9ece4;
    --surface: #faf7ef;
    --ink: #252b27;
    --muted: #6f6d61;
    --line: #b7ab92;
    --red: #9f3a31;
    --red-soft: #f3e1dc;
    --amber: #8a5c2b;
    --amber-soft: #f2e6d2;
    --teal: #1f4a44;
    --teal-soft: #dce9e2;
    --gold: #b08b4a;
    --ink-deep: #1e2d2a;
    --paper: #f7f2e6;
    --paper-soft: #fffdf8;
    --wash: #f4efe3;
    --radius-card: 2px;
    --space-section: 26px;
    --font-body: "PingFang SC", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    --font-serif: "Songti SC", "STSong", "Noto Serif SC", serif;
    --header-muted: #c7d3cd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image: url("assets/paper.svg");
    background-size: 900px 900px;
    color: var(--ink);
    font-family: var(--font-body);
    letter-spacing: 0;
  }
  a { color: var(--red); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: var(--ink-deep);
    border-bottom: 3px solid var(--gold);
    color: var(--paper);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { width: 38px; height: 38px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .08em; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--header-muted); }
  .back {
    color: var(--header-muted);
    font-size: 12px;
    text-decoration: none;
    border: 1px solid rgba(247,242,230,.28);
    padding: 6px 10px;
  }
  main {
    flex: 1;
    width: min(100%, 980px);
    margin: 0 auto;
    padding: 28px 18px 44px;
  }
  h2 { margin: 0 0 8px; font-family: var(--font-serif); font-size: 28px; letter-spacing: .1em; }
  .intro { margin: 0 0 18px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .search-row input {
    flex: 1;
    min-width: 220px;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--paper-soft);
    color: var(--ink);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .chip.active { background: var(--red); border-color: var(--red); color: #fff; }
  .status-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 18px; }
  .status-chip {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .status-chip.active { border-color: var(--teal); background: var(--teal-soft); color: #0b4f4a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .term {
    position: relative;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: var(--radius-card);
  }
  .term h3 { margin: 0 0 8px; font-size: 17px; color: var(--ink-deep); font-family: var(--font-serif); }
  .src-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 6px;
    font-size: 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    vertical-align: middle;
  }
  .src-badge.ok { color: #0b5f58; background: var(--teal-soft); border-color: #9fd6cd; }
  .src-badge.synthetic { color: #6d4c41; background: #f0e6d8; border-color: #d5c0a3; }
  .src-badge.pending { color: #8a5200; background: var(--amber-soft); border-color: #e6c58f; }
  .term .src { margin: 0 0 8px; font-size: 11px; color: var(--amber); line-height: 1.6; }
  .term .row { margin: 7px 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
  .term .row b { display: block; color: var(--red); font-size: 11px; letter-spacing: .08em; }
  footer {
    padding: 14px 18px 24px;
    font-size: 11px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
    border-top: 1px dashed var(--line);
  }
  footer a { text-decoration: underline; }
</style>

      { term: "奇门", group: "三式", src: "《奇门遁甲》体系（流派差异待复核）", plain: "时空决策沙盘。", modern: "九宫格推演、角色网格。", scene: "把时间、方位、角色放进盘里。", note: "推演不是宣判。", source: "三式" },
      { term: "六壬", group: "三式", src: "《六壬大全》体系（流派差异待复核）", plain: "从起点到结果的事态路径。", modern: "四课三传、流程链。", scene: "一件事怎么走。", note: "路径是候选，不是注定。", source: "三式" },
      { term: "月将", group: "三式", src: "三式通行术语（流派差异待复核）", plain: "当月的节律基准。", modern: "时节坐标、基准点。", scene: "当前时间的锚。", note: "口径要显式标。", source: "三式" },
      { term: "四课", group: "三式", src: "《六壬大全·入手法》：四课无克号为遥（章节已对校）", plain: "事态环境的信息输入。", modern: "输入条件、环境上下文。", scene: "事情发生前的背景。", note: "输入不等于结果。", source: "三式" },
      { term: "三传", group: "三式", src: "《六壬大全·入手法》：三传既定天盘将（章节已对校）", plain: "路径链：起点、中转、落点。", modern: "流程链、路径推演。", scene: "事情从哪起、怎么走、落哪。", note: "路径可复现才可信。", source: "三式" },
      { term: "值符值使", group: "三式", src: "奇门通行术语（流派差异待复核）", plain: "当前局面的负责人和关键通道。", modern: "主控角色、关键入口。", scene: "谁在主导、哪里能走。", note: "看结构，不看吉凶。", source: "三式" },
      { term: "空亡", group: "三式", src: "三式通行术语（流派差异待复核）", plain: "结构缺位或盲区。", modern: "缺失条件、未覆盖区。", scene: "有局但某个条件不在。", note: "缺位不是没有作用。", source: "三式" },
      { term: "驿马", group: "三式", src: "三式通行术语（流派差异待复核）", plain: "变动和触发的信号。", modern: "迁移、变化、动态点。", scene: "出行、调动、突发变化。", note: "信号要等样本验证。", source: "三式" },
      { term: "河图洛书", group: "三式", src: "易学通行体系（待复核）", plain: "古人的矩阵和拓扑。", modern: "数字结构、空间模型。", scene: "把复杂关系放进格子。", note: "模型不是咒语。", source: "易学" },
      { term: "象", group: "原理", src: "《周易·系辞》：圣人立象以尽意", plain: "语言说不清时，用符号搭桥。", modern: "结构模型、系统映射。", scene: "把现实翻译成可检查的结构。", note: "象是桥，不是终点。", source: "周易" },
      { term: "留白", group: "原理", src: "《老子》：有之以为利，无之以为用；《文心雕龙》：隐也者，文外之重旨者也", plain: "空处才是用。", modern: "界面留白、系统留接口、判断留余地。", scene: "系统讲完，留给你写自己的解。", note: "墨给够，但不能铺满。", source: "老子/文心雕龙" },
      { term: "谋事在人成事在天", group: "原理", src: "俗语，作品定位语", plain: "人负责如实做事，结果由现实给。", modern: "过程可控，结果待验证。", scene: "做样本、做记录、不承诺结果。", note: "这是边界，不是口号。", source: "俗语" },
      { term: "太极", group: "原理", src: "《周易·系辞》：易有太极，是生两仪", plain: "还没分之前的整体。", modern: "系统未拆分前的全量。", scene: "一个问题还没拆开时的混沌感。", note: "太极不是空，是包含一切。", source: "周易" },
      { term: "两仪", group: "原理", src: "《周易·系辞》：是生两仪", plain: "阴阳两股势。", modern: "二分类、主客、正反。", scene: "任何事拆开都有两边。", note: "两仪是分，不是争。", source: "周易" },
      { term: "四象", group: "原理", src: "易学通行体系", plain: "老阳、少阳、老阴、少阴。", modern: "四种状态：满、升、沉、退。", scene: "事物在四个阶段里的位置。", note: "状态会变，不能定死。", source: "易学" },
      { term: "八卦", group: "原理", src: "《周易·说卦》体系", plain: "八种基本结构。", modern: "八类模型、八种角色。", scene: "把复杂事情分到八个框里看。", note: "卦是模型，不是判决。", source: "周易" },
      { term: "先天八卦", group: "原理", src: "易学通行体系（待复核）", plain: "结构本来的排列。", modern: "静态拓扑、底层关系。", scene: "事情还没动时的底层结构。", note: "先看关系，再看运行。", source: "易学" },
      { term: "后天八卦", group: "原理", src: "易学通行体系（待复核）", plain: "运转中的排列。", modern: "动态分布、当前布局。", scene: "事情正在动时的位置。", note: "后天看时，先天看体。", source: "易学" },
      { term: "纳甲", group: "原理", src: "易学通行体系（待复核）", plain: "把干支装进卦里。", modern: "给结构标角色和坐标。", scene: "一个模型里每个人的位置。", note: "装进去是为了可查。", source: "易学" },
      { term: "十二长生", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "气从生到死的十二段。", modern: "生命周期、成熟度。", scene: "一件事正处在哪个阶段。", note: "长生到墓库，不是好坏。", source: "命理" },
      { term: "旺相休囚死", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "五行在季节里的力量。", modern: "权重、优先级、当前强弱。", scene: "这个季节谁最有力。", note: "力量不等于结果。", source: "命理" },
      { term: "六亲", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "十神映射到家人角色。", modern: "关系映射、社会角色。", scene: "父母、子女、兄弟在盘里的对应。", note: "映射不是标签定罪。", source: "命理" },
      { term: "命宫", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "你自己在盘里的起坐处。", modern: "核心配置、自我定位。", scene: "你习惯从哪个位置看世界。", note: "命宫不是命运，是视角。", source: "命理" },
      { term: "身宫", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "后天行动的自己。", modern: "执行层、行为模式。", scene: "你实际做事时的样子。", note: "命看心，身看行。", source: "命理" },
      { term: "大限", group: "八字", src: "紫微通行术语（流派差异待复核）", plain: "十年一段的阶段。", modern: "周期窗口、阶段预算。", scene: "这十年主要走哪条路。", note: "阶段是结构，不是定数。", source: "紫微" },
      { term: "流年", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "一年变化。", modern: "年度节奏、年度主题。", scene: "今年重点在哪。", note: "流年是刻度，不是判决。", source: "命理" },
      { term: "神煞", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "经验标记。", modern: "标签系统、提醒信号。", scene: "某些时间更容易触发某些事。", note: "标签要样本验证。", source: "命理" },
      { term: "天乙贵人", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "顺境里帮你的信号。", modern: "助力信号、关键人脉。", scene: "有人替你开口、给你机会。", note: "贵人也是结构，不是恩赐。", source: "命理" },
      { term: "桃花", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "吸引和被注意的信号。", modern: "关系热度、曝光度。", scene: "突然被人看见、被人靠近。", note: "桃花是热度，不是结果。", source: "命理" },
      { term: "天德月德", group: "八字", src: "命理通行术语（流派差异待复核）", plain: "天时给的顺风窗口。", modern: "有利时段、缓冲期。", scene: "这段时间做某些事更顺。", note: "顺风也要自己划船。", source: "命理" },
      { term: "二十八宿", group: "天文", src: "古天文通行体系（待复核）", plain: "星空分成的二十八格。", modern: "天区坐标网格。", scene: "给星星定位、给时间分区。", note: "网格是工具，不是神。", source: "古天文" },
      { term: "三垣", group: "天文", src: "古天文通行体系（待复核）", plain: "天空分成三个大区。", modern: "顶层组织分区。", scene: "像给天空做行政区划。", note: "分区为了可查。", source: "古天文" },
      { term: "北斗", group: "天文", src: "古天文通行体系（待复核）", plain: "定方向的原点。", modern: "导航基准、主坐标系。", scene: "古人靠它定北、定季节。", note: "北斗是基准，不是终点。", source: "古天文" },
      { term: "黄道", group: "天文", src: "古天文通行体系（待复核）", plain: "太阳走过的路。", modern: "太阳坐标系。", scene: "二十四节气就沿着它走。", note: "观测口径要标清。", source: "古天文" },
      { term: "赤道", group: "天文", src: "古天文通行体系（待复核）", plain: "天球上的赤道。", modern: "天赤道坐标系。", scene: "给星体定位的基准线。", note: "坐标不是意义。", source: "古天文" },
      { term: "十二次", group: "天文", src: "古天文通行体系（待复核）", plain: "把天区切成十二段。", modern: "周期分区、时间切片。", scene: "岁星经过的十二个位置。", note: "分区与历法口径要复核。", source: "古天文" },
      { term: "十二辰", group: "天文", src: "古天文通行体系（待复核）", plain: "地平方向分成十二段。", modern: "方位坐标、时辰坐标。", scene: "子午卯酉这些方位与时刻。", note: "天文与术数口径要分清楚。", source: "古天文" },
      { term: "岁差", group: "天文", src: "古天文通行体系（待复核）", plain: "节气点会慢慢移动。", modern: "坐标系漂移、长期校准。", scene: "今天春分点和古人不同。", note: "历法必须带历元。", source: "古天文" },
      { term: "天地盘", group: "三式", src: "六壬通行术语（流派差异待复核）", plain: "基准和运转两层盘。", modern: "双坐标、基础层加运行层。", scene: "固定位置加当前时刻。", note: "两层都要标口径。", source: "六壬" },
      { term: "遁甲", group: "三式", src: "奇门通行术语（流派差异待复核）", plain: "甲被藏起来。", modern: "主控角色隐藏。", scene: "真正的关键不一定在最显眼处。", note: "藏不是没有。", source: "奇门" },
      { term: "计神", group: "三式", src: "太乙通行术语（待复核）", plain: "时间层面的信号。", modern: "时间变量、计时参考。", scene: "这个时辰的节律信息。", note: "辅助指标，不单独断。", source: "太乙" },
      { term: "文昌", group: "三式", src: "太乙通行术语（待复核）", plain: "文书、文化、路径信号。", modern: "信息路径、知识信号。", scene: "文字、文书、传播方向。", note: "看位置，不直接断吉凶。", source: "太乙" },
      { term: "始击", group: "三式", src: "太乙通行术语（待复核）", plain: "攻击或触发信号。", modern: "冲突点、触发点。", scene: "事情突然被点燃的位置。", note: "触发不等于结局。", source: "太乙" },
      { term: "贵神", group: "三式", src: "六壬通行术语（流派差异待复核）", plain: "关系里的关键角色。", modern: "社会角色、助力角色。", scene: "谁在你事情里起关键作用。", note: "角色要结合全盘。", source: "六壬" },
      { term: "天将", group: "三式", src: "六壬通行术语（流派差异待复核）", plain: "关系里的辅助角色。", modern: "环境角色、外部力量。", scene: "谁在周围推动或消耗。", note: "将神是标签，不是判决。", source: "六壬" },
      { term: "暗干", group: "三式", src: "奇门通行术语（流派差异待复核）", plain: "藏起来的天干。", modern: "隐藏角色、潜在角色。", scene: "表面没写出来但实际存在的力量。", note: "暗干要显式标，不能猜。", source: "奇门" },
      { term: "甲子", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "主干落在种子位，起点低调但根深。", modern: "框架与输入结合。", scene: "低调启动、早期积累。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "乙丑", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "柔的力量被收着，适合暗中准备。", modern: "适配层与冷储结合。", scene: "秘密准备、暗中打磨。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "丙寅", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "曝光和启动同时来，早期就被看见。", modern: "传播与冷启动结合。", scene: "新项目刚起步就有热度。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "丁卯", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "持续输出压过批量噪声。", modern: "常驻服务与并发结合。", scene: "在忙乱中坚持做一件事。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "戊辰", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "大承载加大容量，稳但容易积压。", modern: "底座与存储结合。", scene: "平台稳定但库存越堆越多。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "己巳", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "运营接住流量，能把热变养料。", modern: "运营与连接结合。", scene: "热度来了有人能接住。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "庚午", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "改革在最高点发生，最锋利也最险。", modern: "变革与峰值结合。", scene: "事业高点做重大决定。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "辛未", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "精工正好收成，质量高但可能拖。", modern: "精加工与归档结合。", scene: "最后阶段反复打磨。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "壬申", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "大流被制度接住，可复制但可能失活。", modern: "流动与规则结合。", scene: "流量被流程接住。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "癸酉", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "细渗透进精密层，影响深但难显。", modern: "渗透与精工结合。", scene: "细节慢慢改变系统。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "甲戌", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "框架进平台收口，能成体系但易封闭。", modern: "框架与平台结合。", scene: "项目收进大平台。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "乙亥", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "柔连接未分化需求，能接住想法但难成形。", modern: "适配与源头结合。", scene: "很多想法被接住却没落地。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "丙子", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "光在最深处，还没到显的时候。", modern: "传播与潜藏结合。", scene: "好事还没公开。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "丁丑", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "持续维护旧系统，稳定但无新意。", modern: "常驻与冷储结合。", scene: "守着一套旧系统。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "戊寅", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "底座托住启动，能支撑但可能压住生长。", modern: "底座与启动结合。", scene: "平台支持新项目。", note: "候选，待样本验证。", source: "六十甲子" },
      { term: "己卯", group: "六十甲子", src: "颐真初笺：由本柱干支名义合成（干支名义已对校）", plain: "运营支持批量，能供给但容易忙乱。", modern: "运营与批量结合。", scene: "一边维护一边赶量。", note: "候选，待样本验证。", source: "六十甲子" },

      { term: "甲午乙未", group: "纳音", src: "纳音通行表（待复核）", plain: "沙中金，埋在沙里的金，要淘。", modern: "潜在价值、待筛选资源。", scene: "好东西需要被挖掘。", note: "候选，待样本验证。", source: "纳音" },
      { term: "丙申丁酉", group: "纳音", src: "纳音通行表（待复核）", plain: "山下火，靠山而燃，有依托。", modern: "依托平台的热度。", scene: "有靠山，但也受限。", note: "候选，待样本验证。", source: "纳音" },
      { term: "戊戌己亥", group: "纳音", src: "纳音通行表（待复核）", plain: "平地木，平地上的木，易长也易被伐。", modern: "普及型增长、可复制资产。", scene: "长得快，但要防被砍。", note: "候选，待样本验证。", source: "纳音" },
      { term: "庚子辛丑", group: "纳音", src: "纳音通行表（待复核）", plain: "壁上土，墙上的土，附着而存。", modern: "依赖外部框架的支撑。", scene: "不独立，但能加固。", note: "候选，待样本验证。", source: "纳音" },
      { term: "壬寅癸卯", group: "纳音", src: "纳音通行表（待复核）", plain: "金箔金，薄金，亮而脆。", modern: "表面装饰、精致层。", scene: "好看，但不能承重。", note: "候选，待样本验证。", source: "纳音" },
      { term: "甲辰乙巳", group: "纳音", src: "纳音通行表（待复核）", plain: "覆灯火，罩着灯，能照但受保护。", modern: "受控曝光、有限可见。", scene: "看得见，但不完全公开。", note: "候选，待样本验证。", source: "纳音" },
      { term: "丙午丁未", group: "纳音", src: "纳音通行表（待复核）", plain: "天河水，从天而降，大而不可控。", modern: "宏观流量、外部冲击。", scene: "规模大，但很难管理。", note: "候选，待样本验证。", source: "纳音" },
      { term: "戊申己酉", group: "纳音", src: "纳音通行表（待复核）", plain: "大驿土，大路旁土，承重也承压。", modern: "主干设施、交通基础。", scene: "重要，但长期被磨损。", note: "候选，待样本验证。", source: "纳音" },
      { term: "庚戌辛亥", group: "纳音", src: "纳音通行表（待复核）", plain: "钗钏金，首饰金，重装饰。", modern: "品牌层、表面价值。", scene: "用于展示，不用于承重。", note: "候选，待样本验证。", source: "纳音" },
      { term: "壬子癸丑", group: "纳音", src: "纳音通行表（待复核）", plain: "桑柘木，养蚕之木，被利用也滋养。", modern: "生产原料、生态循环。", scene: "价值来自被使用。", note: "候选，待样本验证。", source: "纳音" },
      { term: "甲寅乙卯", group: "纳音", src: "纳音通行表（待复核）", plain: "大溪水，溪水奔流，明而急。", modern: "明确流量、快速通道。", scene: "方向清楚，流速快。", note: "候选，待样本验证。", source: "纳音" },
      { term: "丙辰丁巳", group: "纳音", src: "纳音通行表（待复核）", plain: "沙中土，沙土松软，难承重。", modern: "松散底座、非固化层。", scene: "适合种植，不适合盖楼。", note: "候选，待样本验证。", source: "纳音" },
      { term: "戊午己未", group: "纳音", src: "纳音通行表（待复核）", plain: "天上火，天火，高而烈。", modern: "顶级曝光、全局热度。", scene: "极高可见，也极难接住。", note: "候选，待样本验证。", source: "纳音" },
      { term: "庚申辛酉", group: "纳音", src: "纳音通行表（待复核）", plain: "石榴木，果木，能结果也有刺。", modern: "有产出的资产，带防御性。", scene: "能收获，也容易扎手。", note: "候选，待样本验证。", source: "纳音" },
      { term: "壬戌癸亥", group: "纳音", src: "纳音通行表（待复核）", plain: "大海水，最大最深的收藏。", modern: "全域储备、终极沉淀。", scene: "容量最大，也最看不见底。", note: "候选，待样本验证。", source: "纳音" }
    ];
    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const chipsWrap = document.getElementById("chips");
    const groups = ["全部", "天干", "地支", "关系", "六十甲子", "纳音", "八字", "三式", "天文", "原理"];
    let activeGroup = "全部";
    let activeStatus = "all";
    function sourceStatus(src) {
      if (/待补原文|待确认|待收录|待锚定|初笺待复核/.test(src)) return "pending";
      if (/待复核/.test(src) && !/通行|流派差异/.test(src)) return "pending";
      if (/颐真初笺|初笺|通行|流派差异/.test(src)) return "synthetic";
      if (src.includes("已对校")) return "ok";
      return "ok";
    }
    groups.forEach(g => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (g === activeGroup ? " active" : "");
      b.textContent = g;
      b.addEventListener("click", () => {
        activeGroup = g;
        chipsWrap.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x.textContent === g));
        render();
      });
      chipsWrap.appendChild(b);
    });
    document.querySelectorAll("#statusChips .status-chip").forEach(b => {
      b.addEventListener("click", () => {
        activeStatus = b.getAttribute("data-status");
        document.querySelectorAll("#statusChips .status-chip").forEach(x => x.classList.toggle("active", x === b));
        render();
      });
    });
    function render() {
      const q = search.value.trim();
      const list = DATA.filter(d => {
        const deep = NAYIN_DEEP[d.term] || {};
        const deepJ = JIAZI_DEEP[d.term] || {};
        const deepS = DEEP_DATA[d.term] || {};
        const searchable = d.term + d.plain + d.modern + d.scene + d.source + deep.sharp + deep.limit + deep.verify + deepJ.essence + deepJ.use + deepJ.over + deepJ.verify + deepJ.luokuan + deepS.source + deepS.benyi + deepS.tian + deepS.di + deepS.ren + deepS.ti + deepS.yong + deepS.guo + deepS.modern + deepS.life + deepS.verify + deepS.luokuan;
        const status = sourceStatus(d.src);
        return (activeGroup === "全部" || d.group === activeGroup) && (activeStatus === "all" || status === activeStatus) && (!q || searchable.includes(q));
      });
      grid.innerHTML = list.map(d => {
        const deepSym = DEEP_DATA[d.term] || {};
        const status = sourceStatus(d.src);
        const deepRows = DEEP_FIELD_LABELS
          .filter(([field]) => !["source", "modern", "life"].includes(field) && deepSym[field])
          .map(([field, label]) => `<div class="row"><b>${label}</b>${deepSym[field]}</div>`)
          .join("");
        return `
        <article class="term">
          <h3>${d.term}<span class="src-badge ${status}">${status === "ok" ? "已对校" : status === "synthetic" ? "初笺/通行" : "待复核"}</span></h3>
          <p class="src">${d.src}</p>
          <div class="row"><b>人话</b>${d.plain}</div>
          ${deepRows}
          ${JIAZI_DEEP[d.term] ? `<div class="row"><b>开门见山</b>${JIAZI_DEEP[d.term].essence}</div><div class="row"><b>怎么用</b>${JIAZI_DEEP[d.term].use}</div><div class="row"><b>过与不及</b>${JIAZI_DEEP[d.term].over}</div><div class="row"><b>怎么验证</b>${JIAZI_DEEP[d.term].verify}</div><div class="row"><b>你的批注</b>${JIAZI_DEEP[d.term].luokuan}</div>` : ""}
          ${NAYIN_DEEP[d.term] ? `<div class="row"><b>开门见山</b>${NAYIN_DEEP[d.term].sharp}</div><div class="row"><b>过与不及</b>${NAYIN_DEEP[d.term].limit}</div><div class="row"><b>怎么验证</b>${NAYIN_DEEP[d.term].verify}</div>` : ""}
          <div class="row"><b>现代结构</b>${d.modern}</div>
          <div class="row"><b>生活场景</b>${d.scene}</div>
          <div class="row"><b>边界</b>${d.note}</div>
          <div class="row"><b>出处</b>${d.source}</div>
        </article>`;
      }).join("");
    }
    search.addEventListener("input", render);
    render();
  </script>
  <script src="assets/cinematic.js"></script>
