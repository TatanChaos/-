<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档阅读器 · 颐真书房</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<style>
  :root {
    --bg: #e9ece4;
    --paper: #faf7ef;
    --ink: #252b27;
    --muted: #6f6d61;
    --line: #b7ab92;
    --red: #9f3a31;
    --gold: #b08b4a;
    --ink-deep: #1e2d2a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image: url("../assets/paper.svg");
    background-size: 900px 900px;
    color: var(--ink);
    font-family: "PingFang SC", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    letter-spacing: 0;
  }
  a { color: var(--red); }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--ink-deep);
    border-bottom: 3px solid var(--gold);
    color: var(--paper);
  }
  .head-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .head-brand img { width: 32px; height: 32px; flex: 0 0 32px; }
  .head-brand span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 700;
  }
  header a {
    color: #c7d3cd;
    font-size: 12px;
    text-decoration: none;
    border: 1px solid rgba(247, 242, 230, .28);
    padding: 6px 10px;
    white-space: nowrap;
  }
  header a:hover { color: var(--paper); border-color: var(--gold); }
  main {
    flex: 1;
    width: min(100%, 820px);
    margin: 0 auto;
    padding: 16px 14px 34px;
  }
  .doc-page {
    padding: clamp(18px, 4vw, 42px) clamp(16px, 5vw, 52px);
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(30, 30, 20, .07);
    font-size: 15px;
    line-height: 1.95;
  }
  .doc-page h1 {
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 28px;
    line-height: 1.35;
  }
  .doc-page h2 {
    margin: 30px 0 10px;
    padding-left: 10px;
    border-left: 4px solid var(--red);
    font-size: 20px;
  }
  .doc-page h3 {
    margin: 22px 0 8px;
    font-size: 16px;
    color: var(--ink-deep);
  }
  .doc-page p { margin: 0 0 12px; }
  .doc-page ul {
    margin: 0 0 14px;
    padding-left: 22px;
  }
  .doc-page li { margin: 4px 0; }
  .doc-page blockquote {
    margin: 14px 0;
    padding: 10px 14px;
    background: #f2e6d2;
    border-left: 4px solid var(--gold);
    color: var(--muted);
  }
  .doc-page code {
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: .9em;
    background: rgba(31, 74, 68, .08);
    padding: 2px 4px;
  }
  .table-wrap {
    margin: 14px 0;
    overflow-x: auto;
    border: 1px solid var(--line);
  }
  .doc-page table {
    width: 100%;
    min-width: 560px;
    border-collapse: collapse;
    font-size: 13px;
    background: #fffdf8;
  }
  .doc-page th,
  .doc-page td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  .doc-page th {
    background: var(--ink-deep);
    color: var(--paper);
    font-weight: 700;
  }
  .loading, .error {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .error { color: var(--red); }
  footer {
    padding: 12px 14px 24px;
    font-size: 11px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 640px) {
    header { align-items: flex-start; flex-direction: column; }
    .doc-page h1 { font-size: 23px; }
    .doc-page h2 { font-size: 18px; }
    .doc-page { padding: 22px 16px; }
  }
</style>
</head>
<body>
  <header>
    <div class="head-brand">
      <img src="../assets/logo.svg" alt="颐真">
      <span id="docTitle">文档阅读器</span>
    </div>
    <a href="../index.html">返回沙盘</a>
  </header>
  <main>
    <article id="content" class="doc-page">
      <div class="loading">正在读取文档…</div>
    </article>
  </main>
  <footer>© 2026 颐真书房 · 文化研究工具</footer>
  <script>
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function inline(s) {
      s = escapeHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    function renderMarkdown(md) {
      const lines = md.split(/\r?\n/);
      let html = "";
      let list = [];
      let table = [];
      let para = [];
      function flushList() {
        if (!list.length) return;
        html += "<ul>" + list.map(x => "<li>" + x + "</li>").join("") + "</ul>";
        list = [];
      }
      function flushTable() {
        if (!table.length) return;
        html += '<div class="table-wrap"><table>' + table.map(function (row, i) {
          const tag = i === 0 ? "th" : "td";
          return "<tr>" + row.map(function (cell) {
            return "<" + tag + ">" + inline(cell.trim()) + "</" + tag + ">";
          }).join("") + "</tr>";
        }).join("") + "</table></div>";
        table = [];
      }
      function flushPara() {
        if (!para.length) return;
        html += "<p>" + inline(para.join(" ")) + "</p>";
        para = [];
      }
      lines.forEach(function (raw) {
        const line = raw.trimEnd();
        if (line.startsWith("|")) {
          flushList();
          flushPara();
          const cells = line.split("|").slice(1, -1);
          if (cells.every(c => /^:?-{3,}:?$/.test(c.trim()))) return;
          table.push(cells);
          return;
        }
        flushTable();
        if (/^###\s+/.test(line)) {
          flushList(); flushPara();
          html += "<h3>" + inline(line.replace(/^###\s+/, "")) + "</h3>";
        } else if (/^##\s+/.test(line)) {
          flushList(); flushPara();
          html += "<h2>" + inline(line.replace(/^##\s+/, "")) + "</h2>";
        } else if (/^#\s+/.test(line)) {
          flushList(); flushPara();
          html += "<h1>" + inline(line.replace(/^#\s+/, "")) + "</h1>";
        } else if (/^>\s?/.test(line)) {
          flushList(); flushPara();
          html += "<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>";
        } else if (/^[-*]\s+/.test(line)) {
          flushPara();
          list.push(inline(line.replace(/^[-*]\s+/, "")));
        } else if (/^\s*$/.test(line)) {
          flushList(); flushTable(); flushPara();
        } else {
          flushList(); flushTable();
          para.push(line);
        }
      });
      flushList(); flushTable(); flushPara();
      return html;
    }
    async function loadDoc() {
      const params = new URLSearchParams(location.search);
      const file = params.get("file") || "";
      const content = document.getElementById("content");
      const title = document.getElementById("docTitle");
      if (!file) {
        content.innerHTML = '<div class="error">缺少文档参数。</div>';
        return;
      }
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        content.innerHTML = renderMarkdown(md);
        const h1 = content.querySelector("h1");
        const name = h1 ? h1.textContent : decodeURIComponent(file.split("/").pop().replace(/\.md$/, ""));
        title.textContent = name;
        document.title = name + " · 颐真书房";
      } catch (e) {
        title.textContent = "读取失败";
        content.innerHTML = '<div class="error">文档读取失败，请返回后重试。</div>';
      }
    }
    loadDoc();
  </script>
</body>
</html>
