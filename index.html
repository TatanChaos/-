<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>符号映射沙盘</title>
<style>
  :root {
    --bg: #f4f2ec;
    --surface: #fffdf8;
    --ink: #24241f;
    --muted: #6f6d63;
    --line: #d8d3c7;
    --teal: #0f766e;
    --teal-soft: #d9f0ec;
    --amber: #c77700;
    --amber-soft: #faeed8;
    --red: #b43a2f;
    --red-soft: #f6e2de;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(30, 30, 20, .06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    letter-spacing: 0;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: grid;
    place-items: center;
    border-radius: var(--radius);
    background: var(--teal);
    color: #fff;
    font-weight: 700;
    font-size: 18px;
  }
  .brand h1 { margin: 0; font-size: 18px; line-height: 1.25; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
  .layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 14px;
    padding: 14px;
    max-width: 1180px;
    margin: 0 auto;
  }
  .symbol-list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px;
    min-height: 0;
  }
  .list-head {
    font-size: 13px;
    font-weight: 700;
    padding: 4px 6px 10px;
    color: var(--ink);
  }
  .symbol-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .symbol-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .symbol-btn:hover { border-color: var(--teal); }
  .symbol-btn[aria-pressed="true"] {
    background: var(--teal-soft);
    border-color: var(--teal);
    color: #0b4f4a;
  }
  .symbol-btn .zhi { font-weight: 800; font-size: 16px; }
  .symbol-btn .small { font-size: 11px; color: var(--muted); }
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(300px, .95fr);
    gap: 14px;
    align-items: start;
  }
  .detail, .map-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .detail { padding: 16px; min-height: 0; }
  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }
  .detail-head h2 { margin: 0; font-size: 24px; line-height: 1.2; }
  .detail-head .tagline { font-size: 13px; color: var(--muted); }
  .subnav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .subnav-btn {
    font: inherit;
    font-size: 12px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  .subnav-btn:hover { border-color: var(--teal); }
  .subnav-btn[aria-pressed="true"] {
    background: var(--teal-soft);
    border-color: var(--teal);
    color: #0b4f4a;
  }
  .detail-section { margin-top: 12px; }
  .rows { margin-top: 12px; display: grid; gap: 10px; }
  .row {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
  }
  .row .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    padding-top: 2px;
  }
  .row .value { font-size: 14px; line-height: 1.55; word-break: break-word; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .badge {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--surface);
  }
  .badge.teal { color: #0b5f58; background: var(--teal-soft); border-color: #9fd6cd; }
  .badge.amber { color: #8a5200; background: var(--amber-soft); border-color: #e6c58f; }
  .badge.red { color: #8f2d24; background: var(--red-soft); border-color: #e3b7af; }
  .map-panel { padding: 12px; }
  .map-panel h3 {
    margin: 2px 2px 8px;
    font-size: 14px;
  }
  .wheel-wrap { width: 100%; }
  svg { width: 100%; height: auto; display: block; }
  .edge { stroke: var(--line); stroke-width: 1.5; }
  .edge.six { stroke: var(--amber); stroke-opacity: .45; }
  .edge.six.active { stroke: var(--red); stroke-opacity: 1; stroke-width: 2.5; }
  .edge.three { stroke: var(--teal); stroke-opacity: .42; }
  .edge.three.active { stroke: var(--red); stroke-opacity: 1; stroke-width: 2.5; }
  .edge.chong { stroke: #4f6b8a; stroke-opacity: .45; }
  .edge.hai { stroke: #b0563f; stroke-opacity: .45; }
  .edge.xing { stroke: #5b7f4f; stroke-opacity: .45; }
  .edge.chong.active, .edge.hai.active, .edge.xing.active { stroke: var(--red); stroke-opacity: 1; stroke-width: 2.5; }
  .edge.five { stroke: var(--teal); stroke-opacity: .55; }
  .edge.five.active { stroke: var(--red); stroke-opacity: 1; stroke-width: 2.5; }
  .relation-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .rel-btn {
    font: inherit;
    font-size: 12px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  .rel-btn:hover { border-color: var(--teal); }
  .rel-btn[aria-pressed="true"] {
    background: var(--teal-soft);
    border-color: var(--teal);
    color: #0b4f4a;
  }
  .mode-switch {
    display: flex;
    gap: 6px;
    margin: 0 6px 10px;
  }
  .mode-btn {
    flex: 1;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  .mode-btn:hover { border-color: var(--teal); }
  .mode-btn[aria-pressed="true"] {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .node { cursor: pointer; }
  .node circle {
    fill: var(--surface);
    stroke: var(--line);
    stroke-width: 1.5;
    transition: fill .15s ease;
  }
  .node:hover circle, .node.active circle { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 2.5; }
  .node text {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 700;
    pointer-events: none;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 3px; display: inline-block; }
  .footnote {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .symbol-buttons { grid-template-columns: repeat(4, 1fr); }
    .workspace { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .topbar { flex-direction: column; align-items: flex-start; }
    .symbol-buttons { grid-template-columns: repeat(3, 1fr); }
    .row { grid-template-columns: 70px minmax(0, 1fr); }
    .detail-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">符</div>
      <div>
        <h1>符号映射沙盘</h1>
        <p>十二地支 · 拓展面候选 · 不做计算依据</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span>六合连线 · 三合群组 · 现代系统映射</div>

  <main class="layout">

      <div class="mode-switch" id="modeSwitch" role="group" aria-label="符号体系">
        <button type="button" class="mode-btn" data-mode="zhi" aria-pressed="true">地支</button>
        <button type="button" class="mode-btn" data-mode="gan" aria-pressed="false">天干</button>
      </div>
      <div id="symbolButtons" class="symbol-buttons"></div>
    </aside>
    <section class="workspace">
      <article class="detail" id="detail" aria-live="polite"></article>
      <div class="map-panel">
        <h3>十二地支映射轮</h3>
        <div id="relationControls" class="relation-controls" aria-label="地支关系类型"></div>
        <div class="wheel-wrap">
          <svg id="wheel" viewBox="0 0 560 560" role="img" aria-label="十二地支映射轮盘"></svg>
        </div>
        <div class="legend">
          <span><i style="background:#0f766e"></i>三合群</span>
          <span><i style="background:#c77700"></i>六合连线</span>
          <span><i style="background:#4f6b8a"></i>六冲</span>
          <span><i style="background:#b0563f"></i>六害</span>
          <span><i style="background:#5b7f4f"></i>三刑</span>
          <span><i style="background:#b43a2f"></i>当前符号</span>
        </div>
      </div>
      <div class="footnote">
        本页面把传统符号翻译成现代系统语言，全部按“拓展面候选”处理；可验证假设需要真实数据回填，不构成物理或医学结论。
      </div>
    </section>
  </main>

    "辛": { gan: "辛", name: "阴金 · 珠玉 · 西方", yin: "阴", wuxing: "金", dir: "西方", image: "珠玉、精炼", he: "丙辛合水", func: "精加工、审美、收敛", system: "芯片、精密工艺、界面打磨", hypothesis: "精密层出错成本最高", edge: "它不是砍下去的力量，是刻出来的细节。" },
    "壬": { gan: "壬", name: "阳水 · 江河 · 北方", yin: "阳", wuxing: "水", dir: "北方", image: "江河、流动", he: "丁壬合木", func: "流动、分发、连接全域", system: "数据流、网络、流量分发", hypothesis: "流量越大，越需要堤岸", edge: "水能载舟，也能冲垮旧结构。" },
    "癸": { gan: "癸", name: "阴水 · 雨露 · 北方", yin: "阴", wuxing: "水", dir: "北方", image: "雨露、渗透", he: "戊癸合火", func: "渗透、润滑、细粒度扩散", system: "渗透测试、埋点、润化层", hypothesis: "细粒度渗透比大规模冲击更持久", edge: "不声不响，却已经进到内部。" }
  };
  const VERIFY_ZHI = {
    "子": "记录输入源新增与系统多样性的关系，观察一段时间内新增事件或字段数量。",
    "丑": "对比冷数据归档前后，系统响应速度与稳定性是否变化。",
    "寅": "记录新项目或新入口启动后，系统结构在多久内发生变化。",
    "卯": "对比并发数提升前后，产出量与错误率是否同步上升。",
    "辰": "对比缓存充足与清空前后，系统波动是否明显不同。",
    "巳": "记录连接密度上升时，信息传播速度与噪声是否同步增长。",
    "午": "记录热榜或峰值出现后，流量衰减曲线的实际形状。",
    "未": "对比成果归档前后，长期复用率是否提高。",
    "申": "对比规则明确前后，交接效率与可复制性是否提升。",
    "酉": "记录精密层每次改动带来的故障率或返工成本。",
    "戌": "对比平台开放期与封闭期，用户活跃度和外部冲击是否不同。",
    "亥": "记录混沌需求被结构化前后的转化率变化。"
  };
  const VERIFY_GAN = {
    "甲": "记录主干确定前后，分支增长速度是否变快。",
    "乙": "对比适配层变化时，系统稳定性是否受到影响。",
    "丙": "记录曝光峰值出现后的留存与衰减曲线。",
    "丁": "对比持续输出与脉冲式输出的长期效果。",
    "戊": "对比底座扩容前后，上层变更频率是否更安全。",
    "己": "对比定期沉淀与整理前后，检索效率是否提升。",
    "庚": "记录重构前后，系统复杂度与缺陷率是否下降。",
    "辛": "记录精加工前后，错误率与用户感知是否改善。",
    "壬": "记录流量增大时，系统是否需要堤岸或限流。",
    "癸": "记录细粒度渗透后，长期影响是否比一次性冲击更持久。"
  };
  const EXAMPLE_ZHI = {
    "子": "数据采集管道、实时输入流",
    "丑": "冷备份库、档案室",
    "寅": "新产品冷启动、Git init",
    "卯": "多线程任务、内容批量生产",
    "辰": "缓存池、云盘",
    "巳": "热搜、即时通讯、API 调用",
    "午": "直播峰值、活动上线",
    "未": "知识库归档、作品集",
    "申": "标准协议、审批流",
    "酉": "编译器、芯片流片",
    "戌": "平台生态、会员闭环",
    "亥": "原始日志、需求池"
  };
  const EXAMPLE_GAN = {
    "甲": "项目主分支、系统内核",
    "乙": "插件系统、兼容层",
    "丙": "品牌曝光、宣发",
    "丁": "客服后台、夜间值班",
    "戊": "云底座、数据库",
    "己": "缓存维护、内容运营",
    "庚": "代码重构、迁移脚本",
    "辛": "界面打磨、精密制造",
    "壬": "流量分发、数据管道",
    "癸": "渗透测试、埋点"
  };
  const ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
  const GAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
  const SIX = [["子", "丑"], ["寅", "亥"], ["卯", "戌"], ["辰", "酉"], ["巳", "申"], ["午", "未"]];
  const THREE = [["申", "子", "辰"], ["亥", "卯", "未"], ["寅", "午", "戌"], ["巳", "酉", "丑"]];
  const CHONG = [["子", "午"], ["丑", "未"], ["寅", "申"], ["卯", "酉"], ["辰", "戌"], ["巳", "亥"]];
  const HAI = [["子", "未"], ["丑", "午"], ["寅", "巳"], ["卯", "辰"], ["申", "亥"], ["酉", "戌"]];
  const XING = [["寅", "巳", "申"], ["丑", "戌", "未"], ["子", "卯"]];
  const WUHE = [["甲", "己"], ["乙", "庚"], ["丙", "辛"], ["丁", "壬"], ["戊", "癸"]];
  const REL_LABELS = { six: "六合", three: "三合", chong: "六冲", hai: "六害", xing: "三刑" };
  let activeRel = { six: true, three: true, chong: true, hai: true, xing: true };
  let mode = "zhi";
  let selectedZhi = "戌";
  let selectedGan = "甲";
  let detailTab = "overview";

  function pos(zhi) {
    const i = ZHI.indexOf(zhi);
    const angle = -90 + i * 30;
    const r = 215;
    const rad = angle * Math.PI / 180;
    return { x: 280 + r * Math.cos(rad), y: 280 + r * Math.sin(rad) };
  }

  function ganPos(g) {
    const i = GAN.indexOf(g);
    const angle = -90 + i * 36;
    const r = 215;
    const rad = angle * Math.PI / 180;
    return { x: 280 + r * Math.cos(rad), y: 280 + r * Math.sin(rad) };
  }

  function currentSelected() {
    return mode === "zhi" ? selectedZhi : selectedGan;
  }

  function currentData() {
    return mode === "zhi" ? DATA[selectedZhi] : GAN_DATA[selectedGan];
  }

  function renderModeButtons() {
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === mode));
      btn.addEventListener("click", () => {
        mode = btn.getAttribute("data-mode");
        detailTab = "overview";
        renderModeButtons();
        renderButtons();
        renderRelControls();
        renderWheel();
        renderDetail();
      });
    });
  }

  function renderButtons() {
    const wrap = document.getElementById("symbolButtons");
    wrap.innerHTML = "";
    const list = mode === "zhi" ? ZHI : GAN;
    const selected = currentSelected();
    list.forEach(key => {
      const b = document.createElement("button");
      b.className = "symbol-btn";
      b.type = "button";
      b.setAttribute("aria-pressed", String(key === selected));
      const d = mode === "zhi" ? DATA[key] : GAN_DATA[key];
      b.innerHTML = '<span class="zhi">' + key + '</span><span class="small">' + d.func.split("、")[0] + '</span>';
      b.addEventListener("click", () => select(key));
      wrap.appendChild(b);
    });
  }

  function renderRelControls() {
    const wrap = document.getElementById("relationControls");
    if (mode !== "zhi") {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "";
    wrap.innerHTML = "";
    Object.keys(REL_LABELS).forEach(key => {
      const b = document.createElement("button");
      b.className = "rel-btn";
      b.type = "button";
      b.textContent = REL_LABELS[key];
      b.setAttribute("aria-pressed", String(activeRel[key]));
      b.addEventListener("click", () => {
        activeRel[key] = !activeRel[key];
        renderRelControls();
        renderWheel();
      });
      wrap.appendChild(b);
    });
  }

  function drawEdges(groups, cls) {
    const svg = document.getElementById("wheel");
    const ns = "http://www.w3.org/2000/svg";
    groups.forEach(group => {
      group.forEach((z, i) => {
        if (group.length === 2 && i > 0) return;
        const a = pos(z);
        const b = pos(group[(i + 1) % group.length]);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
        line.setAttribute("class", "edge " + cls);
        line.setAttribute("data-rel", cls);
        line.setAttribute("data-pair", [z, group[(i + 1) % group.length]].join(""));
        svg.appendChild(line);
      });
    });
  }

  function renderWheel() {
    const svg = document.getElementById("wheel");
    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";
    if (mode === "gan") {
      WUHE.forEach(pair => {
        const a = ganPos(pair[0]), b = ganPos(pair[1]);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
        line.setAttribute("class", "edge five");
        line.setAttribute("data-pair", pair.join(""));
        svg.appendChild(line);
      });
      GAN.forEach(g => {
        const p = ganPos(g);
        const node = document.createElementNS(ns, "g");
        node.setAttribute("class", "node");
        node.setAttribute("data-key", g);
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 27);
        const t = document.createElementNS(ns, "text");
        t.setAttribute("x", p.x); t.setAttribute("y", p.y + 5);
        t.setAttribute("text-anchor", "middle");
        t.textContent = g;
        node.appendChild(c); node.appendChild(t);
        node.addEventListener("click", () => select(g));
        svg.appendChild(node);
      });
      highlightWheel();
      return;
    }
    if (activeRel.six) drawEdges(SIX, "six");
    if (activeRel.three) drawEdges(THREE, "three");
    if (activeRel.chong) drawEdges(CHONG, "chong");
    if (activeRel.hai) drawEdges(HAI, "hai");
    if (activeRel.xing) drawEdges(XING, "xing");
    ZHI.forEach(z => {
      const p = pos(z);
      const g = document.createElementNS(ns, "g");
      g.setAttribute("class", "node");
      g.setAttribute("data-key", z);
      const c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 27);
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", p.x); t.setAttribute("y", p.y + 5);
      t.setAttribute("text-anchor", "middle");
      t.textContent = z;
      g.appendChild(c); g.appendChild(t);
      g.addEventListener("click", () => select(z));
      svg.appendChild(g);
    });
    highlightWheel();
  }

  function highlightWheel() {
    const svg = document.getElementById("wheel");
    const selected = currentSelected();
    svg.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.getAttribute("data-key") === selected));
    svg.querySelectorAll(".edge").forEach(e => {
      const pair = e.getAttribute("data-pair");
      e.classList.toggle("active", pair.includes(selected));
    });
  }

  function renderDetail() {
    const d = currentData();
    const el = document.getElementById("detail");
    const headKey = mode === "zhi" ? d.zhi : d.gan;
    const verify = mode === "zhi" ? VERIFY_ZHI[selectedZhi] : VERIFY_GAN[selectedGan];
    const example = mode === "zhi" ? EXAMPLE_ZHI[selectedZhi] : EXAMPLE_GAN[selectedGan];
    const metaHTML = mode === "zhi"
      ? `<div class="row"><div class="label">藏干</div><div class="value">${d.cang}</div></div>
         <div class="row"><div class="label">方位</div><div class="value">${d.dir}</div></div>
         <div class="row"><div class="label">时辰</div><div class="value">${d.hour}</div></div>
         <div class="row"><div class="label">生肖</div><div class="value">${d.animal}</div></div>
         <div class="row"><div class="label">月令</div><div class="value">${d.month}</div></div>`
      : `<div class="row"><div class="label">阴阳</div><div class="value">${d.yin}</div></div>
         <div class="row"><div class="label">五行</div><div class="value">${d.wuxing}</div></div>
         <div class="row"><div class="label">方位</div><div class="value">${d.dir}</div></div>
         <div class="row"><div class="label">意象</div><div class="value">${d.image}</div></div>`;
    const relationHTML = mode === "zhi"
      ? `<div class="row"><div class="label">关系</div><div class="value">${d.rel}</div></div>`
      : `<div class="row"><div class="label">五合</div><div class="value">${d.he}</div></div>`;
    const tabs = [
      ["overview", "总览"],
      ["structure", "结构"],
      ["system", "系统"],
      ["relation", mode === "zhi" ? "关系" : "五合"],
      ["verify", "验证"],
      ["source", "原文"]
    ];
    const section = {
      overview: `<div class="rows">${metaHTML}<div class="row"><div class="label">结构功能</div><div class="value">${d.func}</div></div><div class="row"><div class="label">现代系统</div><div class="value">${d.system}</div></div><div class="row"><div class="label">可验证假设</div><div class="value">${d.hypothesis}</div></div><div class="row"><div class="label">象意</div><div class="value">${d.edge}</div></div></div>`,
      structure: `<div class="rows"><div class="row"><div class="label">结构功能</div><div class="value">${d.func}</div></div><div class="row"><div class="label">象意</div><div class="value">${d.edge}</div></div></div>`,
      system: `<div class="rows"><div class="row"><div class="label">现代系统</div><div class="value">${d.system}</div></div><div class="row"><div class="label">现实例子</div><div class="value">${example}</div></div><div class="row"><div class="label">可验证假设</div><div class="value">${d.hypothesis}</div></div></div>`,
      relation: `<div class="rows">${relationHTML}<div class="row"><div class="label">含义</div><div class="value">${mode === "zhi" ? "六合=协作；三合=同盟；六冲=对立；六害=暗中消耗；三刑=结构性摩擦" : "五合=协作/化气，需看全局是否成化"}</div></div></div>`,
      verify: `<div class="rows"><div class="row"><div class="label">验证方法</div><div class="value">${verify}</div></div><div class="row"><div class="label">状态</div><div class="value">待真实样本回填，未回填前不视为已验</div></div></div>`,
      source: `<div class="rows"><div class="row"><div class="label">本地底稿</div><div class="value">十二地支详解 / 十天干详解</div></div><div class="row"><div class="label">原文状态</div><div class="value">待补原文锚定</div></div><div class="row"><div class="label">建议</div><div class="value">逐条查《三命通会》《滴天髓》《渊海子平》等，标版本后再进正式体系</div></div></div>`
    }[detailTab];
    el.innerHTML = `
      <div class="detail-head">
        <h2>${headKey} · ${d.name}</h2>
        <div class="tagline">${d.func}</div>
      </div>
      <div class="subnav" role="tablist" aria-label="符号详情分节">
        ${tabs.map(t => `<button type="button" class="subnav-btn" role="tab" data-tab="${t[0]}" aria-pressed="${detailTab === t[0]}">${t[1]}</button>`).join("")}
      </div>
      <div class="detail-section" role="tabpanel">${section}</div>
      <div class="badges">
        <span class="badge teal">拓展面候选</span>
        <span class="badge amber">待真实样本</span>
        <span class="badge red">不作计算依据</span>
      </div>`;
    el.querySelectorAll(".subnav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchDetail(btn.getAttribute("data-tab")));
    });
  }

  function switchDetail(tab) {
    detailTab = tab;
    renderDetail();
  }

  function select(z) {
    if (mode === "zhi") selectedZhi = z; else selectedGan = z;
    detailTab = "overview";
    document.querySelectorAll(".symbol-btn").forEach(b => {
      const pressed = b.querySelector(".zhi").textContent === z;
      b.setAttribute("aria-pressed", String(pressed));
    });
    renderDetail();
    highlightWheel();
  }

  renderModeButtons();
  renderButtons();
  renderRelControls();
  renderWheel();
  renderDetail();
</script>
</body>
</html>
